<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Calendario de Exámenes 2026-27</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        button { touch-action: manipulation; }
        .tabular-nums { font-variant-numeric: tabular-nums; }

        @keyframes flash-bg {
            0%, 40% { background-color: #fef3c7; }
            100% { background-color: transparent; }
        }
        .flash { animation: flash-bg 1.4s ease-out; }

        #agenda-aside { scrollbar-width: thin; }

        @media (max-width: 640px) {
            #event-modal .modal-content {
                width: 100vw;
                max-width: 100vw;
                max-height: 92vh;
                border-radius: 1rem 1rem 0 0;
                margin-top: auto;
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 antialiased">

    <!-- Carga -->
    <div id="loading-indicator" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600"></div>
    </div>

    <!-- Encabezado -->
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-gray-200">
        <div class="max-w-[1400px] mx-auto px-4 h-14 flex items-center justify-between gap-3">
            <div class="min-w-0">
                <h1 class="text-base sm:text-lg font-bold leading-tight truncate"><span class="hidden sm:inline">Calendario de </span>Exámenes</h1>
                <p id="period" class="text-[11px] sm:text-xs text-gray-500 leading-tight truncate"></p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button id="sync-pill" type="button" class="text-xs font-medium px-2.5 py-1 rounded-full border bg-gray-100 text-gray-600 border-gray-200">…</button>
                <button id="settings-button" type="button" title="Token de GitHub" aria-label="Configurar sincronización" class="w-9 h-9 rounded-full hover:bg-gray-100 active:bg-gray-200 flex items-center justify-center text-lg">⚙️</button>
            </div>
        </div>
    </header>

    <main class="max-w-[1400px] mx-auto px-4 py-4 sm:py-6 space-y-4 sm:space-y-6">

        <!-- Próximo examen -->
        <div id="next-exam"></div>

        <div class="lg:grid lg:grid-cols-[minmax(0,1fr)_360px] lg:gap-6 lg:items-start">

            <!-- Columna izquierda: meses + inscripciones -->
            <div class="space-y-4 sm:space-y-6 min-w-0">
                <div id="subject-filter" class="flex gap-2 overflow-x-auto lg:flex-wrap pb-1 -mx-4 px-4 lg:mx-0 lg:px-0" style="scrollbar-width:none"></div>

                <div id="months" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>

                <div class="flex items-center gap-4 text-xs text-gray-500 px-1 flex-wrap">
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-600"></span> Disponible</span>
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-600 ring-2 ring-offset-1 ring-emerald-500"></span> Inscripto</span>
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full border-[1.5px] border-blue-600"></span> Elegiste otra fecha</span>
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-gray-300"></span> Bloqueada (correlativa)</span>
                </div>

                <section>
                    <div class="flex items-center justify-between mb-3 px-1">
                        <h2 class="text-lg sm:text-xl font-bold flex items-center gap-2">
                            Mis inscripciones
                            <span id="subscriptions-badge" class="hidden px-2 py-0.5 bg-emerald-600 text-white rounded-full text-xs font-semibold">0</span>
                        </h2>
                        <button id="reset-button" type="button" class="text-xs text-red-700 hover:bg-red-50 px-2.5 py-1.5 rounded-lg">Borrar todo</button>
                    </div>
                    <div id="subscriptions-list" class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden"></div>
                </section>
            </div>

            <!-- Columna derecha (solo PC): agenda -->
            <aside id="agenda-aside" class="hidden lg:block sticky top-20 max-h-[calc(100vh-6rem)] overflow-y-auto bg-white rounded-2xl shadow-sm border border-gray-200">
                <div class="px-4 pt-4 pb-2">
                    <h2 class="text-lg font-bold">Agenda</h2>
                    <p class="text-xs text-gray-500">Tocá un día del calendario para saltar acá.</p>
                </div>
                <div id="agenda-list" class="pb-3"></div>
            </aside>
        </div>
    </main>

    <!-- Modal -->
    <div id="event-modal" class="fixed inset-0 bg-black/50 flex items-end sm:items-center justify-center sm:p-4 z-50 hidden">
        <div class="modal-content bg-white sm:rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-screen">
            <div id="modal-header" class="flex items-start justify-between gap-3 p-4 sm:p-5 bg-blue-600 shrink-0">
                <h3 id="modal-title" class="text-lg sm:text-xl font-bold text-white"></h3>
                <button id="close-modal" type="button" aria-label="Cerrar" class="text-white hover:bg-white/20 rounded-full p-1 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div class="p-4 sm:p-5 space-y-4 overflow-y-auto flex-1">
                <div id="modal-note" class="hidden"></div>
                <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-3 text-sm">
                    <dt class="text-gray-500">Fecha</dt>
                    <dd id="modal-datetime" class="font-semibold first-letter:uppercase"></dd>
                    <dt class="text-gray-500">División</dt>
                    <dd id="modal-div" class="font-medium"></dd>
                    <dt class="text-gray-500">Profesor</dt>
                    <dd id="modal-prof" class="font-medium"></dd>
                    <dt class="text-gray-500">Sede</dt>
                    <dd>
                        <span id="modal-location" class="font-medium block"></span>
                        <span id="modal-address" class="text-gray-600 text-xs block mt-0.5"></span>
                        <span id="modal-phone" class="text-gray-600 text-xs block"></span>
                    </dd>
                </dl>
            </div>
            <div class="p-4 bg-gray-50 flex sm:justify-end shrink-0 border-t border-gray-100">
                <button id="subscribe-button" type="button" class="w-full sm:w-auto px-6 py-3 rounded-lg bg-blue-600 text-white font-semibold">Inscribirme</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
