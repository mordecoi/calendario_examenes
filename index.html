<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Calendario de Exámenes 2026-27</title>
    <script>
        // Aplicar el tema antes de pintar (evita un destello claro)
        (function () {
            var pref = null;
            try { pref = localStorage.getItem('theme'); } catch (e) {}
            var dark = pref ? pref === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.classList.add('dark');
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        button { touch-action: manipulation; }
        .tabular-nums { font-variant-numeric: tabular-nums; }

        @keyframes flash-bg {
            0%, 40% { background-color: #fef3c7; }
            100% { background-color: transparent; }
        }
        .flash { animation: flash-bg 1.4s ease-out; }

        #agenda-aside { scrollbar-width: thin; }

        /* --- Modo oscuro suave --- */
        html.dark { color-scheme: dark; }
        .dark body, .dark .bg-gray-100 { background-color: #171a21; }
        .dark .bg-white { background-color: #20242d; }
        .dark .bg-white\/90, .dark .bg-white\/95 { background-color: rgba(32, 36, 45, .92); }
        .dark .bg-gray-50 { background-color: #262b35; }
        .dark .bg-gray-200 { background-color: #343a46; }
        .dark .bg-gray-300 { background-color: #4a5160; }
        .dark .bg-sky-100 { background-color: #1e2633; }
        .dark .text-gray-900 { color: #e7e9ee; }
        .dark .text-gray-700 { color: #cdd1da; }
        .dark .text-gray-600 { color: #aab0bc; }
        .dark .text-gray-500 { color: #8d94a1; }
        .dark .text-gray-400 { color: #6f7684; }
        .dark .border-gray-100 { border-color: #2b303b; }
        .dark .border-gray-200 { border-color: #343a46; }
        .dark .bg-gray-900, .dark .view-tab[aria-selected="true"] { background-color: #e2e5eb; color: #14171d; }
        .dark .border-gray-900 { border-color: #e2e5eb; }
        .dark .bg-emerald-50 { background-color: rgba(16, 185, 129, .13); }
        .dark .bg-emerald-100 { background-color: rgba(16, 185, 129, .22); }
        .dark .text-emerald-700 { color: #6ee7b7; }
        .dark .text-emerald-600 { color: #34d399; }
        .dark .border-emerald-200 { border-color: rgba(16, 185, 129, .35); }
        .dark .bg-amber-50 { background-color: rgba(245, 158, 11, .12); }
        .dark .bg-amber-100 { background-color: rgba(245, 158, 11, .22); }
        .dark .text-amber-900, .dark .text-amber-800 { color: #fcd34d; }
        .dark .text-amber-700 { color: #fbbf24; }
        .dark .border-amber-200 { border-color: rgba(245, 158, 11, .35); }
        .dark .bg-blue-50 { background-color: rgba(59, 130, 246, .14); }
        .dark .text-blue-900, .dark .text-blue-700 { color: #93c5fd; }
        .dark .text-blue-600 { color: #60a5fa; }
        .dark .border-blue-200 { border-color: rgba(59, 130, 246, .35); }
        .dark .bg-red-50 { background-color: rgba(239, 68, 68, .12); }
        .dark .text-red-700 { color: #fca5a5; }
        .dark .border-red-200 { border-color: rgba(239, 68, 68, .35); }
        .dark .hover\:bg-gray-50:hover, .dark .hover\:bg-gray-100:hover, .dark .hover\:bg-white:hover { background-color: #2b303b; }
        .dark .active\:bg-gray-100:active, .dark .active\:bg-gray-200:active { background-color: #343a46; }
        .dark .hover\:bg-emerald-100:hover { background-color: rgba(16, 185, 129, .22); }
        .dark .hover\:bg-blue-50:hover, .dark .active\:bg-blue-100:active { background-color: rgba(59, 130, 246, .2); }
        .dark .hover\:bg-amber-100:hover { background-color: rgba(245, 158, 11, .22); }
        .dark .hover\:bg-red-50:hover, .dark .hover\:bg-red-100:hover { background-color: rgba(239, 68, 68, .2); }
        .dark .ring-white\/70 { --tw-ring-color: rgba(32, 36, 45, .7); }
        @keyframes flash-bg-dark {
            0%, 40% { background-color: rgba(245, 158, 11, .25); }
            100% { background-color: transparent; }
        }
        .dark .flash { animation-name: flash-bg-dark; }
        .star { animation: twinkle 3s ease-in-out infinite alternate; }
        @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }

        /* --- Montaña --- */
        .climber { transform: translate(-50%, -100%); animation: bob 1.6s ease-in-out infinite; }
        @keyframes bob {
            0%, 100% { transform: translate(-50%, -100%); }
            50% { transform: translate(-50%, calc(-100% - 4px)); }
        }
        .node-next { animation: ring-pulse 1.6s ease-out infinite; }
        @keyframes ring-pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, .7); }
            100% { box-shadow: 0 0 0 16px rgba(16, 185, 129, 0); }
        }
        .node-pop { animation: node-pop .55s ease-out; }
        @keyframes node-pop {
            0% { transform: translate(-50%, -50%) scale(.4); }
            70% { transform: translate(-50%, -50%) scale(1.4); }
            100% { transform: translate(-50%, -50%) scale(1.15); }
        }
        .cloud { animation: drift 14s ease-in-out infinite alternate; }
        @keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
        .smoke { transform-box: fill-box; transform-origin: center; animation: smoke 3s ease-out infinite; }
        @keyframes smoke {
            0% { opacity: .7; transform: translateY(0) scale(.6); }
            100% { opacity: 0; transform: translateY(-20px) scale(1.5); }
        }
        .trail-draw { transition: stroke-dashoffset .9s ease-in-out; }
        .river-flow { animation: river-flow 2.4s linear infinite; }
        @keyframes river-flow { to { stroke-dashoffset: -48; } }
        .route-fade { opacity: 0; animation: fade-in .5s .5s forwards; }
        @keyframes fade-in { to { opacity: 1; } }
        .route-out { transition: opacity .3s; opacity: 0; }
        .view-tab[aria-selected="true"] { background: #111827; color: #fff; }

        @media (prefers-reduced-motion: reduce) {
            .climber, .node-next, .node-pop, .cloud, .smoke, .river-flow, .star { animation: none !important; }
            .trail-draw { transition: none !important; }
            .route-fade { opacity: 1; animation: none; }
        }

        @media (max-width: 640px) {
            #event-modal .modal-content {
                width: 100vw;
                max-width: 100vw;
                max-height: 92vh;
                border-radius: 1rem 1rem 0 0;
                margin-top: auto;
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 antialiased">

    <!-- Carga -->
    <div id="loading-indicator" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600"></div>
    </div>

    <!-- Encabezado -->
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-gray-200">
        <div class="max-w-[1400px] mx-auto px-4 h-14 flex items-center justify-between gap-3">
            <div class="min-w-0">
                <h1 class="text-base sm:text-lg font-bold leading-tight truncate"><span class="hidden sm:inline">Calendario de </span>Exámenes</h1>
                <p id="period" class="text-[11px] sm:text-xs text-gray-500 leading-tight truncate"></p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button id="sync-pill" type="button" class="text-xs font-medium px-2.5 py-1 rounded-full border bg-gray-100 text-gray-600 border-gray-200">…</button>
                <button id="theme-button" type="button" title="Modo oscuro" aria-label="Modo oscuro" class="w-9 h-9 rounded-full hover:bg-gray-100 active:bg-gray-200 flex items-center justify-center text-lg">🌙</button>
                <button id="settings-button" type="button" title="Token de GitHub" aria-label="Configurar sincronización" class="w-9 h-9 rounded-full hover:bg-gray-100 active:bg-gray-200 flex items-center justify-center text-lg">⚙️</button>
            </div>
        </div>
    </header>

    <main class="max-w-[1400px] mx-auto px-4 py-4 sm:py-6 space-y-4 sm:space-y-6">

        <!-- Vistas -->
        <div class="flex justify-center">
            <div role="tablist" aria-label="Vista" class="inline-flex bg-white border border-gray-200 rounded-full p-1 shadow-sm">
                <button type="button" role="tab" data-view="calendar" aria-selected="true" class="view-tab px-4 py-1.5 rounded-full text-sm font-semibold text-gray-700 transition-colors">📅 Calendario</button>
                <button type="button" role="tab" data-view="mountain" aria-selected="false" class="view-tab px-4 py-1.5 rounded-full text-sm font-semibold text-gray-700 transition-colors">⛰️ Montaña</button>
            </div>
        </div>

        <!-- Próximo examen (Calendario) / marcador del juego (Montaña) -->
        <div id="next-exam"></div>

        <div class="lg:grid lg:grid-cols-[minmax(0,1fr)_360px] lg:gap-6 lg:items-start">

            <!-- Columna izquierda: meses + inscripciones -->
            <div class="space-y-4 sm:space-y-6 min-w-0">
                <div id="subject-filter" class="flex gap-2 overflow-x-auto lg:flex-wrap pb-1 -mx-4 px-4 lg:mx-0 lg:px-0" style="scrollbar-width:none"></div>

                <div id="view-mountain" class="hidden">
                    <div id="mountain-hud" class="hidden sticky top-16 z-20 mb-3"></div>
                    <div id="mountain" class="isolate rounded-2xl overflow-hidden shadow-sm border border-gray-200 bg-sky-100"></div>
                </div>

                <div id="view-calendar" class="space-y-4 sm:space-y-6">
                <div id="months" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>

                <div class="flex items-center gap-4 text-xs text-gray-500 px-1 flex-wrap">
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-600"></span> Disponible</span>
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-600 ring-2 ring-offset-1 ring-emerald-500"></span> Inscripto</span>
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full border-[1.5px] border-blue-600"></span> Elegiste otra fecha</span>
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-gray-300"></span> Bloqueada (correlativa)</span>
                </div>
                </div>

                <section>
                    <div class="flex items-center justify-between mb-3 px-1">
                        <h2 class="text-lg sm:text-xl font-bold flex items-center gap-2">
                            Mis inscripciones
                            <span id="subscriptions-badge" class="hidden px-2 py-0.5 bg-emerald-600 text-white rounded-full text-xs font-semibold">0</span>
                        </h2>
                        <button id="reset-button" type="button" class="text-xs text-red-700 hover:bg-red-50 px-2.5 py-1.5 rounded-lg">Borrar todo</button>
                    </div>
                    <p id="subscriptions-progress" class="text-xs text-gray-500 px-1 -mt-2 mb-3"></p>
                    <div id="subscriptions-list" class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden"></div>
                    <div id="missing-bottom" class="lg:hidden mt-3"></div>
                </section>
            </div>

            <!-- Columna derecha (solo PC): mis fechas + agenda -->
            <aside class="hidden lg:flex flex-col sticky top-20 h-[calc(100vh-6rem)] bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div id="my-dates" class="shrink-0 max-h-[45%] overflow-y-auto border-b border-gray-200 bg-gray-50"></div>
                <div id="agenda-aside" class="relative flex-1 min-h-0 overflow-y-auto">
                    <div class="px-4 pt-3 pb-2">
                        <h2 class="text-lg font-bold">Agenda</h2>
                        <p id="agenda-hint" class="text-xs text-gray-500">Tocá un día del calendario para saltar acá.</p>
                    </div>
                    <div id="agenda-list" class="pb-3"></div>
                </div>
            </aside>
        </div>
    </main>

    <!-- Modal -->
    <div id="event-modal" class="fixed inset-0 bg-black/50 flex items-end sm:items-center justify-center sm:p-4 z-50 hidden">
        <div class="modal-content bg-white sm:rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-screen">
            <div id="modal-header" class="flex items-start justify-between gap-3 p-4 sm:p-5 bg-blue-600 shrink-0">
                <h3 id="modal-title" class="text-lg sm:text-xl font-bold text-white"></h3>
                <button id="close-modal" type="button" aria-label="Cerrar" class="text-white hover:bg-white/20 rounded-full p-1 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div class="p-4 sm:p-5 space-y-4 overflow-y-auto flex-1">
                <div id="modal-note" class="hidden"></div>
                <div id="modal-result" class="hidden"></div>
                <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-3 text-sm">
                    <dt class="text-gray-500">Fecha</dt>
                    <dd id="modal-datetime" class="font-semibold first-letter:uppercase"></dd>
                    <dt class="text-gray-500">División</dt>
                    <dd id="modal-div" class="font-medium"></dd>
                    <dt class="text-gray-500">Profesor</dt>
                    <dd id="modal-prof" class="font-medium"></dd>
                    <dt class="text-gray-500">Sede</dt>
                    <dd>
                        <span id="modal-location" class="font-medium block"></span>
                        <span id="modal-address" class="text-gray-600 text-xs block mt-0.5"></span>
                        <span id="modal-phone" class="text-gray-600 text-xs block"></span>
                    </dd>
                </dl>
            </div>
            <div class="p-4 bg-gray-50 flex sm:justify-end shrink-0 border-t border-gray-100">
                <button id="subscribe-button" type="button" class="w-full sm:w-auto px-6 py-3 rounded-lg bg-blue-600 text-white font-semibold">Inscribirme</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
